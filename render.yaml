services:
  - type: web
    name: triage-qa
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: NEMC_HOSPITAL_API_KEY
        sync: false
      - key: NEMC_BED_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
